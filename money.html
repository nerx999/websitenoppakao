<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>โปรแกรมแลกเงิน (by Noppakao)</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #bbdefb);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    header {
      background: #1976d2;
      color: white;
      text-align: center;
      padding: 24px 20px;
    }

    h1 {
      font-weight: 700;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 6px;
      font-weight: 300;
      opacity: 0.9;
    }

    .form {
      padding: 24px;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #f5f9ff;
      border-radius: 12px;
      border-left: 4px solid #2196f3;
      transition: all 0.2s;
    }

    .input-group:hover {
      background: #e3f2fd;
      transform: translateX(4px);
    }

    .label {
      font-weight: 500;
      font-size: 16px;
      color: #1565c0;
      flex: 1;
    }

    .input-field {
      width: 80px;
      padding: 8px 12px;
      border: 2px solid #90caf9;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      font-family: 'Kanit', sans-serif;
    }

    .input-field:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.2);
    }

    .btn-calculate {
      display: block;
      width: 100%;
      padding: 16px;
      background: #4CAF50;
      color: white;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 24px 0;
      transition: background 0.3s;
    }

    .btn-calculate:hover {
      background: #43a047;
      transform: scale(1.02);
    }

    .result {
      text-align: center;
      padding: 20px;
      background: #e8f5e9;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      color: #2e7d32;
      border: 2px dashed #81c784;
    }

    .error {
      background: #ffebee !important;
      color: #c62828 !important;
      border-color: #ef9a9a !important;
    }

    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
        text-align: center;
      }
      .label {
        margin-bottom: 8px;
      }
    }
  </style>

  <div class="home-button-container">
    <a href="index.html" class="home-button">home</a>
  </div>
  
</head>
<body>
  <div class="container">
    <header>
      <h1>โปรแกรมหาค่าเงินรวม</h1>
      <div class="subtitle"> © 2025 Noppakao. All rights reserved.</div>
    </header>

    <div class="form" id="form">
      <div class="input-group">
        <span class="label">แบงค์ 1,000 บาท</span>
        <input type="number" class="input-field" id="b1000" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">แบงค์ 500 บาท</span>
        <input type="number" class="input-field" id="b500" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">แบงค์ 100 บาท</span>
        <input type="number" class="input-field" id="b100" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">แบงค์ 50 บาท</span>
        <input type="number" class="input-field" id="b50" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">แบงค์ 20 บาท</span>
        <input type="number" class="input-field" id="b20" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">เหรียญ 10 บาท</span>
        <input type="number" class="input-field" id="c10" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">เหรียญ 5 บาท</span>
        <input type="number" class="input-field" id="c5" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">เหรียญ 2 บาท</span>
        <input type="number" class="input-field" id="c2" min="0" value="0">
      </div>
      <div class="input-group">
        <span class="label">เหรียญ 1 บาท</span>
        <input type="number" class="input-field" id="c1" min="0" value="0">
      </div>

      <button class="btn-calculate" onclick="calculate()">คำนวณยอดรวม 💰</button>

      <div class="result" id="result">ยอดเงินทั้งหมด: 0 บาท</div>
    </div>
  </div>

  <script>
    function calculate() {
      try {
        const b1000 = parseInt(document.getElementById('b1000').value) || 0;
        const b500  = parseInt(document.getElementById('b500').value)  || 0;
        const b100  = parseInt(document.getElementById('b100').value)  || 0;
        const b50   = parseInt(document.getElementById('b50').value)   || 0;
        const b20   = parseInt(document.getElementById('b20').value)   || 0;
        const c10   = parseInt(document.getElementById('c10').value)   || 0;
        const c5    = parseInt(document.getElementById('c5').value)    || 0;
        const c2    = parseInt(document.getElementById('c2').value)    || 0;
        const c1    = parseInt(document.getElementById('c1').value)    || 0;

        const total = b1000*1000 + b500*500 + b100*100 + b50*50 + b20*20 + c10*10 + c5*5 + c2*2 + c1*1;

        document.getElementById('result').textContent = `ยอดเงินทั้งหมด: ${total.toLocaleString()} บาท`;
        document.getElementById('result').className = 'result';

      } catch (e) {
        document.getElementById('result').textContent = '❌ กรุณากรอกเฉพาะตัวเลข!';
        document.getElementById('result').className = 'result error';
      }
    }

    // เพิ่มลูกเล่น: กด Enter แล้วคำนวณได้
    document.querySelectorAll('.input-field').forEach(input => {
      input.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') calculate();
      });
    });
  </script>
</body>
</html>
